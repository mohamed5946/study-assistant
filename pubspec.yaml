name: study_assistant
description: "Study Assistant — مساعد الطالب: AI-powered study app (local-first)."
publish_to: 'none'
version: 2.7.0+9

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  intl: ^0.20.2
  http: ^1.5.0
  cronet_http: ^1.8.0
  file_picker: ^10.3.3
  pdfx: ^2.9.0
  syncfusion_flutter_pdf: ^35.1.40
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.0
  flutter_timezone: ^5.1.1
  path_provider: ^2.1.5
  image_picker: ^1.0.7
  home_widget: ^0.8.0
  package_info_plus: ^8.3.0
  share_plus: ^10.1.0
  add_2_calendar: ^3.1.1
  flutter_tesseract_ocr: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
  assets:
    - assets/fonts/
    - assets/icon/
    - assets/tessdata/
    - assets/tessdata_config.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0E1B33"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
